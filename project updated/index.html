<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <title>MiniBeats</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>MiniBeats</h2>
        <div>
            <button onclick="showSection('home')">Home</button>
            <button onclick="showSection('songs')">Songs</button>
            <button onclick="showSection('playlists')">Playlists</button>
        </div>
    </nav>

    <!-- HOME -->
    <section id="home" class="section active home">
        <h1>Listen to your favorite music</h1>
        <p>Discover songs and create playlists</p>
        <button class="cta" onclick="showSection('songs')">Explore</button>
    </section>

    <!-- SONGS -->
    <section id="songs" class="section">
        <input type="text" id="search" placeholder="Search songs..." onkeyup="searchSongs()">

        <h2>All Songs</h2>
        <div id="songsContainer"></div>

        <h2>❤️ Favorites</h2>
        <div id="favoritesContainer"></div>
    </section>

    <!-- PLAYLISTS -->
    <section id="playlists" class="section">
        <h2>🎶 Playlists</h2>

        <div class="create-playlist">
            <input id="playlistName" placeholder="Playlist name">
            <button class="cta" onclick="createPlaylist()">Create Playlist</button>
        </div>

        <div id="playlistsContainer"></div>
    </section>

    <!-- MINI PLAYER -->
    <div id="miniPlayer">
        <span id="nowPlaying">Nothing playing</span>
        <div class="player-controls">
            <button onclick="prevSong()">⏮</button>
            <button onclick="togglePlay()">▶️ / ⏸</button>
            <button onclick="nextSong()">⏭</button>
        </div>
        <audio id="globalAudio"></audio>
    </div>

    <script src="script.js"></script>
</body>

</html>
