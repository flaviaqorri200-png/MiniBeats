<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <title>MiniBeats</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>MiniBeats</h2>
        <div>
            <button onclick="showSection('home')">Home</button>
            <button onclick="showSection('songs')">Songs</button>
        </div>
    </nav>

    <!-- HOME -->
    <section id="home" class="section active home">
        <h1>Listen to your favorite music and disvover new songs.</h1>
        <p>...a new app to follow your flow...</p>
        <button class="cta" onclick="showSection('songs')">Explore more</button>
    </section>

    <!-- SONGS -->
    <section id="songs" class="section">
        <input type="text" id="search" placeholder="What do you want to listen?" onkeyup="searchSongs()">

        <h2>All Songs</h2>
        <div id="songsContainer"></div>

        <h2>❤️ Favorite Songs</h2>
        <div id="favoritesContainer"></div>
    </section>

    <script src="script.js"></script>
</body>

</html>
